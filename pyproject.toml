[project]
name = "graderproof"
version = "0.0.1"
description = "Mutation and metamorphic testing for agent-benchmark graders: false-accept and false-reject rates with validated evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "raj200501" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
graderproof = "graderproof.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graderproof"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]
"src/graderproof/cli.py" = ["PLC0415"]  # lazy imports keep `graderproof --help` fast
"src/graderproof/spec.py" = ["PLR0911", "PLR0912"]  # evaluate() is a flat dispatch over check types
"tools/**" = ["PLR0911", "PLR0912", "PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["graderproof"]

[tool.coverage.report]
show_missing = true

# G1: adapters that need external services may be excluded from core-module coverage
# only if a recorded-fixture contract test covers them (tests/contract/test_<stem>.py
# with fixtures in tests/fixtures/<stem>/). tools/ship_check.py enforces this.
[tool.graderproof.coverage]
external_adapters = []
